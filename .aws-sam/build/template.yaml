AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Expense Tracker Backend
Parameters:
  EventBusName:
    Type: String
    Default: expense-alert-bus
    Description: Existing EventBridge bus name used for transaction events
Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    Environment:
      Variables:
        USERS_TABLE: Expense-Tracker-User-Table
        CATEGORIES_TABLE: Expense-Tracker-Categories-Table
        TRANSACTIONS_TABLE: Expense-Tracker-Transactions-Table
        LIMITS_TABLE: Expense-Tracker-Limits-Table
        JWT_SECRET: HiiBabe
Resources:
  ExpenseTrackerApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: ExpenseTrackerApiBitch
      StageName: prod
      Cors:
        AllowMethods: '''*'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowOrigin: '''*'''
  QueryServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: QueryServiceFunction
      Handler: index.handler
      Description: Handles query operations
      Environment:
        Variables:
          EVENT_BUS_NAME:
            Ref: EventBusName
      Policies:
      - DynamoDBCrudPolicy:
          TableName: Expense-Tracker-User-Table
      - DynamoDBCrudPolicy:
          TableName: Expense-Tracker-Categories-Table
      - DynamoDBCrudPolicy:
          TableName: Expense-Tracker-Transactions-Table
      - Statement:
          Effect: Allow
          Action:
          - events:PutEvents
          Resource:
            Fn::Sub: arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventBusName}
      Events:
        QueryAPI:
          Type: Api
          Properties:
            RestApiId:
              Ref: ExpenseTrackerApi
            Path: /query/{proxy+}
            Method: ANY
    Metadata:
      SamResourceId: QueryServiceFunction
  AlertServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AlertServiceFunction
      Handler: index.handler
      Description: Handles alerts
      Policies:
      - DynamoDBCrudPolicy:
          TableName: Expense-Tracker-User-Table
      - DynamoDBCrudPolicy:
          TableName: Expense-Tracker-Categories-Table
      - DynamoDBCrudPolicy:
          TableName: Expense-Tracker-Transactions-Table
      - DynamoDBCrudPolicy:
          TableName: Expense-Tracker-Limits-Table
      Events:
        AlertAPI:
          Type: Api
          Properties:
            RestApiId:
              Ref: ExpenseTrackerApi
            Path: /alert/{proxy+}
            Method: ANY
    Metadata:
      SamResourceId: AlertServiceFunction
Outputs:
  ApiUrl:
    Description: Base API URL
    Value:
      Fn::Sub: https://${ExpenseTrackerApi}.execute-api.${AWS::Region}.amazonaws.com/Stage
