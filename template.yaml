AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Expense Tracker Backend Services

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    Environment:
      Variables:
        DB_HOST: "aeronode-rds-server.cf28seae0k2m.ap-south-1.rds.amazonaws.com"
        DB_PORT: "5432"
        DB_USER: "postgres"
        DB_PASSWORD: "Admin$1234"
        DB_NAME: "Expense-Tracker-DB"
        JWT_SECRET: "HiiBabe"

Resources:
  # ── Shared API Gateway ──────────────────────────────────────────────
  ExpenseTrackerApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: ExpenseTrackerApi
      StageName: prod
      Description: Single API Gateway that routes to all backend services
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key'"
        AllowOrigin: "'*'"

  # ── Query Service Lambda ────────────────────────────────────────────
  QueryServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: Query Service/
      Handler: index.handler
      Description: Lambda function for the Query Service
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseTrackerApi
            Path: /query/{proxy+}
            Method: ANY

  # ── Alert Service Lambda ────────────────────────────────────────────
  AlertServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: Alert Service/
      Handler: index.handler
      Description: Lambda function for the Alert Service
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseTrackerApi
            Path: /alert/{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: Base URL of the Expense Tracker API
    Value: !Sub "https://${ExpenseTrackerApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
