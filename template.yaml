AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Expense Tracker Backend

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    Environment:
      Variables:
        USERS_TABLE: Expense-Tracker-User-Table
        CATEGORIES_TABLE: Expense-Tracker-Categories-Table
        TRANSACTIONS_TABLE: Expense-Tracker-Transactions-Table
        LIMITS_TABLE: Expense-Tracker-Limits-Table
        JWT_SECRET: HiiBabe

Resources:

# ─── API Gateway ───────────────────────────────────
  ExpenseTrackerApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: ExpenseTrackerApiBitch
      StageName: prod
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

# ─── Query Service ─────────────────────────────────
  QueryServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: Query Service/
      Handler: index.handler
      Description: Handles query operations
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Expense-Tracker-User-Table
        - DynamoDBCrudPolicy:
            TableName: Expense-Tracker-Categories-Table
        - DynamoDBCrudPolicy:
            TableName: Expense-Tracker-Transactions-Table
      Events:
        QueryAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseTrackerApi
            Path: /query/{proxy+}
            Method: ANY

# ─── Alert Service ─────────────────────────────────
  AlertServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: Alert Service/
      Handler: index.handler
      Description: Handles alerts
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Expense-Tracker-Limits-Table
      Events:
        AlertAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseTrackerApi
            Path: /alert/{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: Base API URL
    Value: !Sub "https://${ExpenseTrackerApi}.execute-api.${AWS::Region}.amazonaws.com/Stage"


